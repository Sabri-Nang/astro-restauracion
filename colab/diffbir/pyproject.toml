[project]
name = "astrorestore-prueba-diffbir"
version = "0.1.0"
description = "Entorno aislado para una prueba acotada de DiffBIR v2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2+cu118",
    "torchvision==0.17.2+cu118",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "scipy==1.12.0",
    "scikit-image==0.24.0",
    "omegaconf==2.3.0",
    "einops==0.7.0",
    "ftfy==6.2.0",
    "regex==2023.12.25",
    "timm==0.9.16",
    "torchsde==0.2.6",
    "pytorch-lightning==2.2.1",
    "setuptools==80.9.0",
    "torchmetrics==1.3.2",
    "huggingface-hub==0.36.0",
    "packaging==24.2",
    "tqdm==4.67.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
