[project]
name = "astro-restauracion"
version = "0.1.0"
description = "Restauración y análisis de imágenes astronómicas mediante inteligencia artificial"
readme = "README.md"
authors = [
    { name = "Sabrina Sanches", email = "sabrinadelosangelessanches@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.42.1",
    "gradio>=6.31.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[tool.uv]
package = false
